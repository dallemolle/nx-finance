name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Imagem fixa (não ubuntu-latest): os jobs usam o Postgres 16 que vem instalado
# nela. Trocar de versão de propósito, conferindo o Postgres da imagem nova (BL-033).
# Node: o mesmo do .nvmrc, usado também no desenvolvimento (BL-034).
jobs:
  checks:
    name: Lint, tipos e testes
    runs-on: ubuntu-24.04

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nx_finance?schema=public
      VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

    steps:
      # Postgres descartável pros testes de integração (rodam em <banco>_test,
      # criado pelo próprio setup do Vitest via prisma db push). Usa o Postgres
      # que já vem instalado no runner: imagem de container dependia de registro
      # externo, e tanto o Docker Hub quanto o ECR Public limitam downloads
      # anônimos dos runners (toomanyrequests).
      - name: Inicia o Postgres do runner
        run: |
          sudo systemctl start postgresql.service
          pg_isready -h localhost -t 30
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb nx_finance

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npx tsc --noEmit

      - name: Testes (unit + integração)
        run: npm test

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-24.04

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nx_finance?schema=public
      NEXTAUTH_SECRET: ci-e2e-secret

    steps:
      # Mesmo Postgres do runner (ver job anterior); o Playwright usa o banco <banco>_e2e.
      - name: Inicia o Postgres do runner
        run: |
          sudo systemctl start postgresql.service
          pg_isready -h localhost -t 30
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb nx_finance

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Instala o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes e2e
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Só sincroniza o schema do banco depois que as verificações passaram.
  # (Antes isso rodava em db-sync.yml, independente de qualquer checagem.)
  db-sync:
    name: Sincroniza schema (${{ github.ref_name }})
    needs: [checks, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ github.ref_name == 'main' && secrets.DATABASE_URL_PRODUCTION || secrets.DATABASE_URL_STAGING }}
